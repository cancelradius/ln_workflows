[project]
name = "ln_workflows"
version = "0.0.0"
description = "Containerized applications for quantum chemistry workflow management"
authors = [
    {name = "Felix Rotter-McCartney",email = "felix.rotter@mail.utoronto.ca"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "quacc[dask] (>=1.4.0,<2.0.0)",
    "maggma (>=0.74.0,<0.75.0)"
]

[dependency-groups]
dev = [
    "ruff (>=0.16.1,<0.17.0)",
    "ty (>=0.0.65,<0.0.66)",
    "python-semantic-release (>=10.6.1,<11.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
